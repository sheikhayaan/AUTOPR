  <text x="60.0" y="580.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a5a72" fill-opacity="1.0" text-anchor="start">Backend is the bulk, but tests are 31% of the tree — the ratio a safety-critical service should have.</text>
