# Alembic configuration.
#
# NOTE: the database URL is intentionally NOT set here. env.py reads it from
# app.config.settings (AUTOPR_DATABASE_URL), so migrations always target the
# exact same database the application uses — no second source of truth to drift.

[alembic]
script_location = alembic
# Timestamped, slugged revision filenames so `versions/` reads chronologically.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
# Store timezone-naive UTC in filenames' generation; harmless for our use.
timezone = UTC
# No post_write_hooks: `ruff` isn't on Alembic's console_scripts entrypoint path
# under `uv`, and the runtime container has no dev tooling. Generated revisions
# are formatted by the normal `ruff format` gate in dev instead.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
