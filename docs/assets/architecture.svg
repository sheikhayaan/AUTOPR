  <text x="86.0" y="340.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e8eefc" fill-opacity="1.0" text-anchor="start">FastAPI ingress</text>
  <text x="86.0" y="362.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8b9bb4" fill-opacity="1.0" text-anchor="start">POST /webhook</text>
  <text x="86.0" y="379.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8b9bb4" fill-opacity="1.0" text-anchor="start">constant-time HMAC</text>
  <text x="86.0" y="396.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8b9bb4" fill-opacity="1.0" text-anchor="start">10 MB cap pre-auth</text>
  <rect x="422.0" y="310.0" width="330.0" height="66.0" rx="12" fill="#0d141f" fill-opacity="1.0" stroke="#1c2536" stroke-width="1.2"/>
  <rect x="423.0" y="310.0" width="328.0" height="3" rx="1.5" fill="#3b82f6" filter="url(#glow)"/>
