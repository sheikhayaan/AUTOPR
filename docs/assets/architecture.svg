  <text x="86.0" y="678.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8b9bb4" fill-opacity="1.0" text-anchor="start">PRJob · JobResult</text>
  <text x="86.0" y="695.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8b9bb4" fill-opacity="1.0" text-anchor="start">ReviewDecision</text>
  <text x="86.0" y="712.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8b9bb4" fill-opacity="1.0" text-anchor="start">the source of truth</text>
  <rect x="422.0" y="626.0" width="330.0" height="66.0" rx="12" fill="#0d141f" fill-opacity="1.0" stroke="#1c2536" stroke-width="1.2"/>
