  <text x="790.0" y="678.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8b9bb4" fill-opacity="1.0" text-anchor="start">--network none</text>
  <text x="790.0" y="695.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8b9bb4" fill-opacity="1.0" text-anchor="start">non-root • ro rootfs</text>
  <text x="790.0" y="712.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8b9bb4" fill-opacity="1.0" text-anchor="start">512 MB · 1.0 CPU</text>
  <text x="60.0" y="780.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a5a72" fill-opacity="1.0" text-anchor="start">Reads and writes cross the lanes in that order — nothing in CORE can mutate a repository without HUMAN passing through the gate.</text>
