  <text x="70.0" y="288.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#3b82f6" fill-opacity="1.0" text-anchor="start" letter-spacing="2.4">EDGE</text>
