[project]
name = "autopr"
version = "0.1.0"
description = "Multi-agent AI system that automates GitHub PR review, test generation, and CI-failure auto-fixing."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "python-dotenv>=1.0",
    # Phase 2: LangGraph orchestration + agents + RAG
    "langchain>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-groq>=0.2",
    "langgraph>=0.2",
    "qdrant-client>=1.12",
    "tiktoken>=0.8",
    "alembic>=1.19.1",
    "prometheus-client>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "fakeredis>=2.26",
    "ruff>=0.8",
    "mypy>=1.13",
]

rag = [
    # Optional local embeddings for the Qdrant RAG grounding. Pulls onnxruntime,
    # so it is opt-in: the app runs with RAG disabled (the worker uses rag=None).
    "fastembed>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
# Pin the interpreter to 3.11; the machine default is 3.14 which the
# LangGraph/LangChain/Qdrant ecosystem does not reliably support yet.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = [
    "B008",   # FastAPI's Depends() in defaults is the framework's idiom, not a bug.
    "UP042",  # Enums intentionally mix in `str` for SQLAlchemy storage; StrEnum changes str() semantics.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
# conftest sets os.environ before importing app.* — Settings runs a fail-fast
# secret validator at import time, so those imports must follow the env setup.
"tests/conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
no_implicit_optional = true
warn_unused_configs = true

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
