  <text x="438.0" y="695.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8b9bb4" fill-opacity="1.0" text-anchor="start">ContextVar-filtered</text>
