  <rect x="48.0" y="420.0" width="1104.0" height="136.0" rx="18" fill="#0a1018" fill-opacity="1.0" stroke="#1a2436" stroke-width="1.2" stroke-dasharray="7 6"/>
  <text x="70.0" y="446.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#a855f7" fill-opacity="1.0" text-anchor="start" letter-spacing="2.4">CORE</text>
  <line x1="70" y1="456" x2="121" y2="456" stroke="#a855f7" stroke-width="2" filter="url(#glow)"/>
  <rect x="70.0" y="468.0" width="330.0" height="66.0" rx="12" fill="#0d141f" fill-opacity="1.0" stroke="#1c2536" stroke-width="1.2"/>
  <rect x="71.0" y="468.0" width="328.0" height="3" rx="1.5" fill="#a855f7" filter="url(#glow)"/>
  <text x="86.0" y="498.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e8eefc" fill-opacity="1.0" text-anchor="start">Job queue</text>
  <text x="86.0" y="520.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8b9bb4" fill-opacity="1.0" text-anchor="start">Redis Streams</text>
  <text x="86.0" y="537.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8b9bb4" fill-opacity="1.0" text-anchor="start">consumer group + PEL</text>
  <text x="86.0" y="554.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8b9bb4" fill-opacity="1.0" text-anchor="start">XAUTOCLAIM 900 s</text>
  <rect x="422.0" y="468.0" width="330.0" height="66.0" rx="12" fill="#0d141f" fill-opacity="1.0" stroke="#1c2536" stroke-width="1.2"/>
  <rect x="423.0" y="468.0" width="328.0" height="3" rx="1.5" fill="#a855f7" filter="url(#glow)"/>
  <text x="438.0" y="498.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e8eefc" fill-opacity="1.0" text-anchor="start">LangGraph</text>
  <text x="438.0" y="520.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8b9bb4" fill-opacity="1.0" text-anchor="start">4 LLM agents</text>
  <text x="438.0" y="537.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8b9bb4" fill-opacity="1.0" text-anchor="start">2 deterministic gates</text>
  <text x="438.0" y="554.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8b9bb4" fill-opacity="1.0" text-anchor="start">6 nodes</text>
  <rect x="774.0" y="468.0" width="330.0" height="66.0" rx="12" fill="#0d141f" fill-opacity="1.0" stroke="#1c2536" stroke-width="1.2"/>
  <rect x="775.0" y="468.0" width="328.0" height="3" rx="1.5" fill="#a855f7" filter="url(#glow)"/>
  <text x="790.0" y="498.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e8eefc" fill-opacity="1.0" text-anchor="start">Human gate</text>
  <text x="790.0" y="520.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8b9bb4" fill-opacity="1.0" text-anchor="start">PENDING decision</text>
  <text x="790.0" y="537.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8b9bb4" fill-opacity="1.0" text-anchor="start">CAS approve → one write</text>
  <path d="M600.0,556.0 L600.0,567.0" stroke="#4a5a72" stroke-width="1.6" fill="none" marker-end="url(#arrowhead)"/>
  <rect x="48.0" y="578.0" width="1104.0" height="136.0" rx="18" fill="#0a1018" fill-opacity="1.0" stroke="#1a2436" stroke-width="1.2" stroke-dasharray="7 6"/>
