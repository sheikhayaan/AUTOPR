  <text x="900.0" y="417.0" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#e8eefc" fill-opacity="1.0" text-anchor="end">1,351</text>
