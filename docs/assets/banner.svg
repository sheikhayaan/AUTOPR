<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="AutoPR — human-gated PR review and CI repair">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a12"/><stop offset="55%" stop-color="#05070d"/>
      <stop offset="100%" stop-color="#04060b"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#05070d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#05070d" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-300%" width="260%" height="700%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#111a26" stroke-width="1"/>
    </pattern>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6"
            markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5a72"/>
    </marker>
  </defs>
  <rect width="1200" height="380" fill="url(#bg)"/>
  <rect width="1200" height="380" fill="url(#grid)" opacity="0.55"/>
  <ellipse cx="210" cy="190" rx="330" ry="230" fill="url(#halo)"/>
  <ellipse cx="1010" cy="120" rx="260" ry="200" fill="url(#halo2)"/>
  <circle cx="200.0" cy="186.0" r="148" fill="none" stroke="#1b2740" stroke-opacity="0.6799999999999999" stroke-width="1.1" stroke-dasharray="3 6"/>
  <circle cx="200.0" cy="186.0" r="116" fill="none" stroke="#1b2740" stroke-opacity="0.74" stroke-width="1.1" stroke-dasharray="3 6"/>
  <circle cx="200.0" cy="186.0" r="84" fill="none" stroke="#1b2740" stroke-opacity="0.8" stroke-width="1.1" stroke-dasharray="3 6"/>
  <circle cx="200.0" cy="186.0" r="148" fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="1.4" stroke-dasharray="46 320" transform="rotate(-30 200.0 186.0)" filter="url(#glow)"/>
  <circle cx="200.0" cy="186.0" r="116" fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="1.4" stroke-dasharray="46 320" transform="rotate(-30 200.0 186.0)" filter="url(#glow)"/>
  <path d="M200.0,140.0 L240.0,158.0 V192.0 C240.0,220.0 218.0,232.0 200.0,238.0 C182.0,232.0 160.0,220.0 160.0,192.0 V158.0 Z" fill="#0b1626" stroke="url(#word)" stroke-width="2.4" filter="url(#softglow)"/>
  <path d="M183.0,190.0 l13,14 l22,-30" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <text x="330.0" y="152.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="url(#word)" fill-opacity="1.0" text-anchor="start">AutoPR</text>
  <text x="330.0" y="196.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#e8eefc" fill-opacity="0.92" text-anchor="start">Reads the diff, drafts the fix, asks a human before it touches a line.</text>
  <text x="330.0" y="226.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#8b9bb4" fill-opacity="1.0" text-anchor="start">Self-hosted FastAPI + LangGraph service for GitHub webhooks. Dry-run by default.</text>
  <rect x="330.0" y="244.0" width="95.5" height="29.0" rx="14.5" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-width="1"/>
  <text x="342.0" y="268.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#22d3ee" fill-opacity="1.0" text-anchor="start">Python 3.11</text>
  <rect x="435.5" y="244.0" width="72.7" height="29.0" rx="14.5" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1"/>
  <text x="447.5" y="268.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3b82f6" fill-opacity="1.0" text-anchor="start">FastAPI</text>
  <rect x="518.1" y="244.0" width="92.0" height="29.0" rx="14.5" fill="#a855f7" fill-opacity="0.12" stroke="#a855f7" stroke-width="1"/>
  <text x="530.1" y="268.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a855f7" fill-opacity="1.0" text-anchor="start">LangGraph</text>
  <rect x="620.1" y="244.0" width="115.2" height="29.0" rx="14.5" fill="#f43f5e" fill-opacity="0.12" stroke="#f43f5e" stroke-width="1"/>
  <text x="632.1" y="268.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#f43f5e" fill-opacity="1.0" text-anchor="start">Redis Streams</text>
  <rect x="745.4" y="244.0" width="134.7" height="29.0" rx="14.5" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="1"/>
  <text x="757.4" y="268.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#f59e0b" fill-opacity="1.0" text-anchor="start">Postgres · SQLite</text>
  <rect x="890.1" y="244.0" width="108.3" height="29.0" rx="14.5" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1"/>
  <text x="902.1" y="268.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#10b981" fill-opacity="1.0" text-anchor="start">React 18 + TS</text>
  <text x="330.0" y="330.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#e8eefc" fill-opacity="1.0" text-anchor="start">264</text>
  <text x="330.0" y="352.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a5a72" fill-opacity="1.0" text-anchor="start" letter-spacing="0.6">backend tests</text>
  <text x="440.2" y="330.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#e8eefc" fill-opacity="1.0" text-anchor="start">62</text>
  <text x="440.2" y="352.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a5a72" fill-opacity="1.0" text-anchor="start" letter-spacing="0.6">frontend tests</text>
  <text x="550.8" y="330.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#e8eefc" fill-opacity="1.0" text-anchor="start">87%</text>
  <text x="550.8" y="352.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a5a72" fill-opacity="1.0" text-anchor="start" letter-spacing="0.6">coverage</text>
  <text x="639.3" y="330.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#e8eefc" fill-opacity="1.0" text-anchor="start">6</text>
  <text x="639.3" y="352.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a5a72" fill-opacity="1.0" text-anchor="start" letter-spacing="0.6">graph nodes</text>
  <text x="743.1" y="330.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#e8eefc" fill-opacity="1.0" text-anchor="start">4</text>
  <text x="743.1" y="352.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a5a72" fill-opacity="1.0" text-anchor="start" letter-spacing="0.6">LLM agents</text>
  <text x="845.0" y="330.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#e8eefc" fill-opacity="1.0" text-anchor="start">1,278</text>
  <text x="845.0" y="352.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a5a72" fill-opacity="1.0" text-anchor="start" letter-spacing="0.6">timed calls</text>
</svg>
