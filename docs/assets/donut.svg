  <text x="60.0" y="78.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#8b9bb4" fill-opacity="1.0" text-anchor="start">15,290 lines across 104 source files, counted at generation time.</text>
  <circle cx="330.0" cy="350.0" r="150.0" fill="none" stroke="#111a26" stroke-width="34.0"/>
  <circle cx="330.0" cy="350.0" r="150.0" fill="none" stroke="#22d3ee" stroke-width="34.0" stroke-linecap="butt" stroke-dasharray="304.79 637.69" stroke-dashoffset="-0.00" transform="rotate(-90 330.0 350.0)" filter="url(#glow)" opacity="0.95"/>
  <circle cx="330.0" cy="350.0" r="150.0" fill="none" stroke="#a855f7" stroke-width="34.0" stroke-linecap="butt" stroke-dasharray="284.08 658.40" stroke-dashoffset="-312.33" transform="rotate(-90 330.0 350.0)" filter="url(#glow)" opacity="0.95"/>
  <circle cx="330.0" cy="350.0" r="150.0" fill="none" stroke="#10b981" stroke-width="34.0" stroke-linecap="butt" stroke-dasharray="247.71 694.77" stroke-dashoffset="-603.95" transform="rotate(-90 330.0 350.0)" filter="url(#glow)" opacity="0.95"/>
  <circle cx="330.0" cy="350.0" r="150.0" fill="none" stroke="#f59e0b" stroke-width="34.0" stroke-linecap="butt" stroke-dasharray="75.74 866.74" stroke-dashoffset="-859.20" transform="rotate(-90 330.0 350.0)" filter="url(#glow)" opacity="0.95"/>
  <text x="330.0" y="346.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#e8eefc" fill-opacity="1.0" text-anchor="middle">15,290</text>
  <text x="330.0" y="372.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b9bb4" fill-opacity="1.0" text-anchor="middle">lines</text>
  <text x="330.0" y="396.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4a5a72" fill-opacity="1.0" text-anchor="middle">excl. deps &amp; builds</text>
